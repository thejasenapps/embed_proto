<!DOCTYPE html>
<html>
<head>
    <base href="/embed_proto/">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="description" content="A new Flutter project.">

    <!-- iOS meta tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="embed_proto">

    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>embed_proto</title>

    <link rel="manifest" href="manifest.json">

    <style>

        /* Floating open button */
        #flutter-launch-btn{
          position:fixed;
          bottom:60px;
          right:60px;
          width:60px;
          height:60px;
          border-radius:50%;
          border:none;
          cursor:pointer;
          font-size:14px;
          color:white;
          background:#1976D2;
          box-shadow:0 8px 25px rgba(0,0,0,0.3);
          z-index:10000;
        }

        /* Flutter mini app container */
        #flutter-container{
          position:fixed;
          bottom:130px;
          right:60px;
          width:375px;
          height:700px;
          border-radius:20px;
          overflow:hidden;
          display:none;
          box-shadow:0 15px 45px rgba(0,0,0,0.4);
          z-index:9999;
        }

        /* Close button */
        #close-btn{
          position:absolute;
          top:8px;
          right:10px;
          z-index:10;
          background:red;
          color:white;
          border:none;
          border-radius:50%;
          width:28px;
          height:28px;
          cursor:pointer;
          font-weight:bold;
        }

        /* iframe styling */
        #flutter-frame{
          width:100%;
          height:100%;
          border:none;
        }

    </style>
</head>

<body>

<!-- Floating button -->
<button id="flutter-launch-btn">Open</button>

 Embedded Flutter App
<div id="flutter-container">
    <button id="close-btn">×</button>

    <iframe
            id="flutter-frame">
    </iframe>
</div>


<!-- Flutter Web Loader -->
<script src="flutter_bootstrap.js" async></script>

<script>


    const launchBtn = document.getElementById("flutter-launch-btn");
    const container = document.getElementById("flutter-container");
    const closeBtn = document.getElementById("close-btn");
    const iframe = document.getElementById("flutter-frame");


    let isDragging = false;

    launchBtn.addEventListener("mousedown", () => {
      isDragging = true;
    });

    document.addEventListener("mousemove", (e) => {

      if(!isDragging) return;

      launchBtn.style.left = e.clientX - 30 + "px";
      launchBtn.style.top = e.clientY - 30 + "px";
      launchBtn.style.bottom = "auto";
      launchBtn.style.right = "auto";

    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
    });

    console.log("Trying to get current path:");
    const currentPath = window.location.pathname;

    console.log("Current page path:", currentPath);

    if(currentPath !== "/embed_proto/" && currentPath !== "/index.html") {
        console.log("Not landing page. Hiding embed widget.");
        launchBtn.style.display = "none";
        container.style.display = "none";
    }

    launchBtn.onclick = function(){

      console.log("Open button clicked");

      container.style.display = "block";

      console.log("Container displayed");

      if(!iframe.getAttribute("src")){
        console.log("src is null/empty. Setting src now...");
        iframe.src = "https://thejasenapps.github.io/embed_proto2/";
        console.log("Iframe src set to:", iframe.src);
      } else {
        console.log("Iframe already has src:", iframe.src);
      }

    }

    closeBtn.onclick = function(){
      container.style.display = "none";
    }

    iframe.onload = function(){
      console.log("Iframe finished loading:", iframe.src);
    }

</script>

</body>
</html>
